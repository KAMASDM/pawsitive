[build]
  command = "node scripts/generate-firebase-sw.js && npm run build"
  publish = "build"

# Firebase API keys are client-side identifiers (not secrets) — security is
# enforced by Firebase Security Rules and domain restrictions, not by keeping
# the key hidden. The compiled Vite bundle always contains the value of
# VITE_FIREBASE_API_KEY; disable Netlify's smart detection to allow it.
[build.environment]
  SECRETS_SCAN_SMART_DETECTION_ENABLED = "false"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# check-and-notify runs hourly: queries Firestore for newly active challenges/quizzes
# (isActive=true, notificationSent=false) and broadcasts FCM topic notifications.
[functions."check-and-notify"]
  schedule = "@hourly"

[functions."commerce-flag-abandoned-carts"]
  schedule = "@hourly"

# Note: Scheduled functions need to be configured via Netlify UI or API
# Schedule: 30 3 * * * (3:30 AM UTC = 9:00 AM IST daily)

[[redirects]]
  from = "/assets/*"
  to = "/asset-unavailable.txt"
  status = 404

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

# Revalidate the actual worker entry points and manifest on each check.
[[headers]]
  for = "/firebase-messaging-sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

# Keep OAuth popups connected to the app.
[[headers]]
  for = "/*"
  [headers.values]
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"

# Missing assets must not cache the SPA fallback or a stale error response.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

[[headers]]
  for = "/release-assets.json"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

[[headers]]
  for = "/version.json"
  [headers.values]
    Cache-Control = "no-store"

[[headers]]
  for = "/asset-unavailable.txt"
  [headers.values]
    Cache-Control = "no-store"
