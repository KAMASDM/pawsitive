[build]
  command = "npm run build"
  publish = "build"

# Firebase API keys are client-side identifiers (not secrets) — security is
# enforced by Firebase Security Rules and domain restrictions, not by keeping
# the key hidden. The compiled Vite bundle always contains the value of
# VITE_FIREBASE_API_KEY; disable Netlify's smart detection to allow it.
[build.environment]
  SECRETS_SCAN_SMART_DETECTION_ENABLED = "false"

# Netlify is retained as a frontend-only fallback. All API, trigger, and
# scheduled workloads are deployed from functions/ through Firebase.

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/service-worker.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/firebase-messaging-sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
